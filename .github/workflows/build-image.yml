name: Build Raspberry Pi Robot Disk Image

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Image configuration profile'
        required: true
        default: 'config/ubuntu24-ros2-pi5.cfg'
      options_file:
        description: 'Image credentials/options file'
        required: true
        default: 'credentials24'
      upload_spaces:
        description: 'Upload finished image to DigitalOcean Spaces'
        type: boolean
        default: true
  schedule:
    # Run weekly production build every Sunday at midnight UTC
    - cron: '0 0 * * 0'

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout code
  packages: read

jobs:
  launch-runner:
    name: Provision Ephemeral AWS Graviton Runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-ec2.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      - name: Start Ephemeral AWS ARM64 Worker
        id: start-ec2
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.UBIQUITY_BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          ec2-image-id: ${{ secrets.PACKER_GOLDEN_AMI_ID || 'ami-0ba451768384e095b' }}
          ec2-instance-type: t4g.xlarge
          subnet-id: ${{ secrets.AWS_SUBNET_ID }}
          security-group-id: ${{ secrets.AWS_SECURITY_GROUP_ID }}
          run-runner-as-user: admin
          pre-runner-script: |
            echo "admin ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/99-admin
            chmod 0440 /etc/sudoers.d/99-admin
            usermod -aG disk admin || true
            echo "admin:100000:65536" > /etc/subuid
            echo "admin:100000:65536" > /etc/subgid
            mkdir -p /etc/containers
            cat << 'CPCEOF' > /etc/containers/containers.conf
            [engine]
            cgroup_manager = "cgroupfs"
            events_logger = "file"
            CPCEOF
            mkdir -p /home/admin
            chown -R admin:admin /home/admin
            mkdir -p /actions-runner
            chown -R admin:admin /actions-runner
            chmod 755 /actions-runner
            modprobe loop || true
            chmod 666 /dev/loop* /dev/loop-control 2>/dev/null || true
            apt-get update
            apt-get install -y zip dosfstools rsync genimage mtools crudini pv python-is-python3 btrfs-progs dctrl-tools ubuntu-archive-keyring s3cmd xz-utils python3-boto3 || true
            mkdir -p /usr/share/keyrings
            curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
            chmod 644 /usr/share/keyrings/ros-archive-keyring.gpg
            if [ ! -s /usr/share/keyrings/ubuntu-archive-keyring.gpg ]; then
              curl -sSL -o /usr/share/keyrings/ubuntu-archive-keyring.gpg https://archive.ubuntu.com/ubuntu/project/ubuntu-archive-keyring.gpg
              chmod 644 /usr/share/keyrings/ubuntu-archive-keyring.gpg
            fi
          aws-resource-tags: >
            [
              {"Key": "Name", "Value": "github-actions-rpi-builder"},
              {"Key": "Project", "Value": "UbiquityRobotics"}
            ]

  build-image:
    name: Synthesize Robot OS Image inside Sandbox
    needs: launch-runner
    runs-on: ${{ needs.launch-runner.outputs.label }}
    steps:
      - name: Checkout rpi-image-gen
        uses: actions/checkout@v4

      - name: Worker Environment & Compatibility Setup
        run: |
          sudo sh -c 'echo "admin:100000:65536" > /etc/subuid'
          sudo sh -c 'echo "admin:100000:65536" > /etc/subgid'
          podman system migrate || true
          podman unshare id
          sudo mkdir -p /usr/share/keyrings
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          sudo chmod 644 /usr/share/keyrings/ros-archive-keyring.gpg
          sudo apt-get update
          sudo apt-get install -y ubuntu-archive-keyring s3cmd xz-utils python3-boto3 || true
          if [ ! -s /usr/share/keyrings/ubuntu-archive-keyring.gpg ]; then
            sudo curl -sSL -o /usr/share/keyrings/ubuntu-archive-keyring.gpg https://archive.ubuntu.com/ubuntu/project/ubuntu-archive-keyring.gpg
            sudo chmod 644 /usr/share/keyrings/ubuntu-archive-keyring.gpg
          fi
          sudo ./install_deps.sh
          mkdir -p /home/admin
          ln -sfn "$GITHUB_WORKSPACE" /home/admin/rpi-image-gen
          sudo modprobe loop || true
          sudo chmod 666 /dev/loop* /dev/loop-control 2>/dev/null || true

      - name: Synthesize RootFS and Provision ROS 2 Stack (Ansible & Colcon)
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$GITHUB_WORKSPACE/work/ros2/host/bin:$PATH"
          SKIP_AUTOMATED_TESTS=1 ./build.sh -r \
            -c "${{ inputs.config_file || 'config/ubuntu24-ros2-pi5.cfg' }}" \
            -o "${{ inputs.options_file || 'credentials24' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.UBIQUITY_BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Execute Automated RootFS Verification Test Suite
        run: |
          ./scripts/automated_tests.sh work/ros2/rootfs

      - name: Synthesize Bootable SD Card Disk Image (genimage)
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$GITHUB_WORKSPACE/work/ros2/host/bin:$PATH"
          ./build.sh -i \
            -c "${{ inputs.config_file || 'config/ubuntu24-ros2-pi5.cfg' }}" \
            -o "${{ inputs.options_file || 'credentials24' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.UBIQUITY_BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Multithreaded SD Card Image Compression (xz -T0)
        run: |
          DEPLOY_DIR="work/ros2/deploy"
          RAW_IMAGE="${DEPLOY_DIR}/ros2.img"
          if [ ! -f "$RAW_IMAGE" ]; then
            RAW_IMAGE=$(find "$DEPLOY_DIR" -maxdepth 1 -name "*.img" | head -n 1)
          fi
          if [ -z "$RAW_IMAGE" ] || [ ! -f "$RAW_IMAGE" ]; then
            echo "Error: No raw .img found in $DEPLOY_DIR"
            exit 1
          fi
          BASE_NAME="ros2-ezmap-pro"
          CURRENT_DATE=$(date +%Y%m%d)
          RANDOM_NUMBER=$(shuf -i 1000-9999 -n 1)
          TARGET_XZ="${DEPLOY_DIR}/${BASE_NAME}_${CURRENT_DATE}_${RANDOM_NUMBER}.img.xz"
          echo "[INFO] Compressing $RAW_IMAGE to $TARGET_XZ using multithreaded xz (all cores)..."
          xz -T0 -v -z "$RAW_IMAGE"
          mv "${RAW_IMAGE}.xz" "$TARGET_XZ"
          ls -lh "$TARGET_XZ"

      - name: High-Speed Parallel Upload to DigitalOcean Spaces
        if: ${{ inputs.upload_spaces != false }}
        run: ./digital-ocean.sh
        env:
          S3_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.SPACES_SECRET_KEY }}

      - name: Publish Step Summary with Download Link and Checksum
        if: always()
        run: |
          DEPLOY_DIR="work/ros2/deploy"
          if [ -d "$DEPLOY_DIR" ]; then
            IMAGE_FILE=$(find "$DEPLOY_DIR" -name "*.img.xz" -o -name "*.img.zst" -o -name "*.img" | head -n 1)
            if [ -n "$IMAGE_FILE" ]; then
              FILENAME=$(basename "$IMAGE_FILE")
              FILESIZE=$(du -h "$IMAGE_FILE" | cut -f1)
              SHA256=$(sha256sum "$IMAGE_FILE" | awk '{print $1}')
              
              echo "## 🚀 Raspberry Pi Image Build Report" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
              echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
              echo "| **Artifact Name** | \`$FILENAME\` |" >> $GITHUB_STEP_SUMMARY
              echo "| **Artifact Size** | \`$FILESIZE\` |" >> $GITHUB_STEP_SUMMARY
              echo "| **SHA256 Checksum** | \`$SHA256\` |" >> $GITHUB_STEP_SUMMARY
              echo "| **Download URL** | [Download from DigitalOcean Spaces](https://ubiquity-pi-image.sfo2.digitaloceanspaces.com/$FILENAME) |" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  terminate-runner:
    name: Terminate Ephemeral AWS Graviton Runner
    needs: [launch-runner, build-image]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      - name: Terminate Ephemeral EC2 Instance
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.UBIQUITY_BOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          label: ${{ needs.launch-runner.outputs.label }}
          ec2-instance-id: ${{ needs.launch-runner.outputs.ec2-instance-id }}
