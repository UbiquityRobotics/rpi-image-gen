---
- name: Enable force-unsafe-io in dpkg for maximum unpack and disk write throughput
  ansible.builtin.copy:
    content: "force-unsafe-io\n"
    dest: /etc/dpkg/dpkg.cfg.d/force-unsafe-io
    mode: '0644'

- name: Install system package dependencies
  ansible.builtin.apt:
    name:
      - curl
      - git
      - gpiod
      - whiptail
      - systemd-resolved
      - network-manager
      - locales
      - fake-hwclock
      - cloud-guest-utils
      - parted
      - plocate
      - build-essential
      - clang
      - lld
      - clang-format
      - clang-tidy
      - cmake
      - ninja-build
      - ccache
      - gdb
      - lldb
      - libeigen3-dev
      - nlohmann-json3-dev
      - libboost-all-dev
      - python3-pip
      - python3-setuptools
      - python3-wheel
      - python3-serial
      - python3-yaml
      - python3-cairosvg
      - python3-joblib
      - python3-networkx
      - python3-shapely
      - python3-skimage
      - python3-numpy
      - python3-scipy
      - python3-pytest
      - nginx
      - sysstat
      - python3-colcon-common-extensions
      # Camera ROS dependencies
      - libjpeg-dev
      - libavcodec-dev
      - libavdevice-dev
      - libavfilter-dev
      - libavformat-dev
      - libavutil-dev
      - libdrm-dev
      - libexif-dev
      - libtiff-dev
      - libudev-dev
      - libv4l-dev
      - libyaml-cpp-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libglib2.0-dev
      # ROS 2 Jazzy peripheral packages
      - ros-jazzy-rmw-zenoh-cpp
      - ros-jazzy-foxglove-bridge
      - ros-jazzy-ament-cmake
      - ros-jazzy-rviz-visual-tools
      - ros-jazzy-vision-msgs
      - ros-jazzy-image-transport
      - ros-jazzy-camera-info-manager
      - ros-jazzy-image-pipeline
      - ros-jazzy-nav2-map-server
      - ros-jazzy-gps-umd
      - libpcl-dev
      - ros-jazzy-pcl-conversions
      - libpcap-dev
      - ros-jazzy-rosbridge-server
      - ros-jazzy-tf-transformations
      - ros-jazzy-nav2-msgs
      - ros-jazzy-nav2-util
      - ros-jazzy-controller-manager
      - ros-jazzy-joint-state-publisher
      - ros-jazzy-xacro
      - ros-jazzy-ros2-control
      - ros-jazzy-ros2-controllers
      - ros-jazzy-camera-ros
      - ros-jazzy-twist-mux
      - ros-jazzy-diagnostic-aggregator
      - ros-jazzy-diagnostic-updater
      - ros-jazzy-angles
    state: present
    update_cache: false

- name: Remove temporary dpkg force-unsafe-io configuration
  ansible.builtin.file:
    path: /etc/dpkg/dpkg.cfg.d/force-unsafe-io
    state: absent

- name: Configure limits.conf for real-time priority of target user
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "{{ target_user }}          -       nice            -20"
    state: present
    create: true
    mode: '0644'

- name: Add target user to groups
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups:
      - dialout
      - video
    append: true

- name: Generate en_US.UTF-8 locale
  ansible.builtin.command:
    cmd: locale-gen en_US.UTF-8

- name: Write locale profile script
  ansible.builtin.copy:
    dest: /etc/profile.d/locale.sh
    content: "export LANG=en_US.UTF-8\n"
    mode: '0644'
