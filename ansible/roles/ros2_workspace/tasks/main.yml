---
# ==============================================================================
# Debian Appliance Underlay Provisioning & Clean User Workspace
# ==============================================================================
- name: Ensure target user home directory exists with 0755 permissions
  ansible.builtin.file:
    path: "{{ target_user_home }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'

- name: Ensure customer ROS 2 workspace src directory exists and is clean
  ansible.builtin.file:
    path: "{{ ros2_ws }}/src"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'

- name: Create temporary debian staging directory inside rootfs
  ansible.builtin.file:
    path: /tmp/ubiquity_debs
    state: directory
    mode: '0755'

- name: Copy fetched Ubiquity Core debian packages into staging directory
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /tmp/ubiquity_debs/
    mode: '0644'
  with_fileglob:
    - "{{ playbook_dir }}/roles/ros2_workspace/files/debs/*.deb"
    - "{{ playbook_dir }}/roles/ros2_workspace/files/*.deb"

- name: Install all Ubiquity Core Appliance debian packages into /opt/ros underlay
  ansible.builtin.apt:
    deb: "{{ item }}"
    state: present
  with_fileglob:
    - "/tmp/ubiquity_debs/*.deb"

- name: Clean up temporary debian staging directory
  ansible.builtin.file:
    path: /tmp/ubiquity_debs
    state: absent

- name: Ensure robot_bringup config directory exists in /opt/ros underlay
  ansible.builtin.file:
    path: "/opt/ros/{{ ros_distro }}/share/robot_bringup/config"
    state: directory
    mode: '0755'

- name: Symlink IMX219 camera calibration to robot_bringup underlay config
  ansible.builtin.file:
    src: "{{ target_user_home }}/.ros/camera_info/imx219__base_axi_pcie_1000120000_rp1_i2c_88000_imx219_10_640x480.yaml"
    dest: "/opt/ros/{{ ros_distro }}/share/robot_bringup/config/camera_info.yaml"
    state: link
    force: true
  ignore_errors: true

- name: Configure target user bashrc for ROS 2 underlay and optional overlay workspace
  become_user: "{{ target_user }}"
  ansible.builtin.blockinfile:
    path: "{{ target_user_home }}/.bashrc"
    block: |
      source /opt/ros/{{ ros_distro }}/setup.bash
      if [ -f "{{ ros2_ws }}/install/setup.bash" ]; then
        source {{ ros2_ws }}/install/setup.bash
      fi
    marker: "# {mark} ANSIBLE MANAGED ROS2 ENVIRONMENT"
    create: true
    mode: '0644'
