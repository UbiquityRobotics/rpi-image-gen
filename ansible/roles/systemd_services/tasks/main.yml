---
- name: Create global ROS 2 execution wrapper for systemd services
  ansible.builtin.copy:
    dest: /usr/local/bin/magni-ros2-run.sh
    mode: '0755'
    content: |
      #!/bin/bash
      # Set up the ROS 2 environment securely
      source /opt/ros/{{ ros_distro }}/setup.bash
      if [ -f "{{ ros2_ws }}/install/setup.bash" ]; then
        source {{ ros2_ws }}/install/setup.bash
      fi

      # Global variables applied to every tier
      export RMW_IMPLEMENTATION={{ rmw_implementation }}

      # CRITICAL: 'exec' replaces the bash process with ros2 launch
      exec ros2 launch "$@"

- name: Deploy hardware.service systemd unit
  ansible.builtin.template:
    src: hardware.service.j2
    dest: /etc/systemd/system/magni-hardware.service
    mode: '0644'

- name: Deploy teleop.service systemd unit
  ansible.builtin.template:
    src: teleop.service.j2
    dest: /etc/systemd/system/magni-teleop.service
    mode: '0644'

- name: Deploy navigation.service systemd unit
  ansible.builtin.template:
    src: navigation.service.j2
    dest: /etc/systemd/system/magni-navigation.service
    mode: '0644'

- name: Deploy diagnostics.service systemd unit
  ansible.builtin.template:
    src: diagnostics.service.j2
    dest: /etc/systemd/system/magni-diagnostics.service
    mode: '0644'

- name: Deploy ui.service systemd unit
  ansible.builtin.template:
    src: ui.service.j2
    dest: /etc/systemd/system/magni-ui.service
    mode: '0644'

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable Magni orchestrator services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - magni-hardware.service
    - magni-teleop.service
    - magni-navigation.service
    - magni-diagnostics.service
    - magni-ui.service
    - nginx

- name: Allow non-interactive reboot/poweroff for EZ-Map services worker
  ansible.builtin.copy:
    content: "{{ target_user }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl reboot, /usr/bin/systemctl poweroff\n"
    dest: /etc/sudoers.d/99-ezmap-systemctl
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Stamp official Ubiquity image build provenance metadata
  ansible.builtin.copy:
    dest: /etc/ubiquity-image-release
    mode: '0644'
    content: |
      IMAGE_NAME="ros2-ezmap-pro"
      BUILD_DATE="{{ ansible_date_time.iso8601 | default('2026-10-26T00:00:00Z') }}"
      ROS_DISTRO="{{ ros_distro }}"
      RMW_IMPLEMENTATION="{{ rmw_implementation }}"
      TARGET_USER="{{ target_user }}"
      TIER_ARCH="5-tier-decoupled"
      EZMAP_FRONTEND="svelte-5-fastcdr-worker"

- name: Write ROS 2 workspace provenance json
  ansible.builtin.copy:
    dest: "{{ ros2_ws }}/.image_provenance.json"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
    content: |
      {
        "image_name": "ros2-ezmap-pro",
        "build_date": "{{ ansible_date_time.iso8601 | default('2026-10-26T00:00:00Z') }}",
        "ros_distro": "{{ ros_distro }}",
        "rmw_implementation": "{{ rmw_implementation }}",
        "tier_architecture": "5-tier-decoupled",
        "provenance_type": "golden_image_synthesis"
      }
